; ResourceLoop stage 1 — placeholder gain rules, hand-checkable in PIE. All values are placeholders
; (vision marks every number in the resource economy open). RT example: a player hit dealing 8 damage
; grants Flow = (1.0 + 0.0*8)*1.0 = 1.0 and Adrenaline = (0.0 + 0.05*8)*0.25 = 0.1.
FlowGain_DamageDealt=(FlatAmount=1.000000,PerDamageCoeff=0.000000)
FlowGain_DamageTaken=(FlatAmount=0.000000,PerDamageCoeff=0.050000)
AdrenalineGain_DamageDealt=(FlatAmount=0.000000,PerDamageCoeff=0.050000)
AdrenalineGain_DamageTaken=(FlatAmount=0.000000,PerDamageCoeff=0.000000)
RTFlowGainMultiplier=1.000000
RTAdrenalineGainMultiplier=0.250000
TBFlowGainMultiplier=0.250000
TBAdrenalineGainMultiplier=1.000000
; ResourceLoop stage 2 — Flow Gauge threshold placeholder (all numbers open per vision). With
; interval 3, stage N is reached at floor(Flow / N) = 3, 6, 9 ...; MaxFlowGauge is clamped to
; FlowHardCeiling in UWolfAttributeSet::PreAttributeChange so the soft cap cannot exceed it.
FlowThresholdInterval=3.000000
FlowHardCeiling=15.000000
; ResourceLoop stage 3 — TB-entry budget gate. false (ship intent): a player whose banked Flow is
; below the first threshold (Stage 0) is REFUSED TB entry (with a log) — banking-before-entering is
; a real decision. Dev-escape: set true to grant a stage-1-equivalent duration so un-resourced test
; maps still enter TB.
bAllowZeroStageTBEntry=False
; ResourceLoop stage 4 — Adrenaline spend (drain rate + the scalar that buys attack speed, damage,
; and Flow-gain in RT). Drain=1/s against a 0-floor is harmless at zero. Scalar = 1.0 + Adrenaline * 0.01,
; clamped to 1.5 — e.g. at 10 Adrenaline the scalar is 1.10 (attacks 10% faster/harder, +10% Flow).
RTAdrenalineDrainPerSecond=1.000000
AdrenalineScalarCoeff=0.010000
MaxAdrenalineScalar=1.500000

